name: 블로그 새 글 자동 업데이트

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "블로그 전체 글을 처음부터 다시 수집할까요? (최초 1회 true)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 글 목록 수집 및 페이지 생성
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scripts/update.py --backfill
          else
            python scripts/update.py
          fi
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "새 글 없음"
          else
            git commit -m "블로그 글 목록 자동 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
